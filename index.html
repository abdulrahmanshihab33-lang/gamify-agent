<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gamify Agent">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Gamify Agent</title>
<style>
:root{--bg:#060a17;--bg2:#0d1430;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#e8ecff;--mut:#93a0c8;--acc:#22d3ee;--acc2:#a78bfa;--good:#34d399;--bad:#fb7185;--gold:#fbbf24;--in:#0a1230;--sheet:#0d1430;--top:#060a17cc;--soft:#ffffff0d;--soft2:#ffffff14;--onacc:#04111f}
:root[data-theme=deep]{--bg:#000;--bg2:#000;--card:#0a0a0d;--line:rgba(255,255,255,.1);--tx:#f2f4ff;--mut:#8b93b3;--in:#000;--sheet:#050507;--top:#000000ee;--soft:#ffffff08;--soft2:#ffffff10}
:root[data-theme=deep] body::before{display:none}
:root[data-theme=deep] .tpl,:root[data-theme=deep] .gate{background:#07070a}
:root[data-theme=light]{--bg:#f2f5ff;--bg2:#e6ebff;--card:rgba(255,255,255,.88);--line:rgba(20,30,90,.14);--tx:#141a3a;--mut:#56628c;--acc:#0891b2;--acc2:#7c3aed;--good:#059669;--bad:#e11d48;--gold:#b45309;--in:#ffffff;--sheet:#ffffff;--top:#f2f5ffe6;--soft:#1e28780f;--soft2:#1e287818;--onacc:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100%}
body{background:var(--bg)}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 85% -10%,#3b1d7a55,transparent),radial-gradient(800px 500px at -10% 10%,#0e749044,transparent);pointer-events:none}
:root[data-theme=light] body::before{background:radial-gradient(900px 500px at 85% -10%,#c4b5fd88,transparent),radial-gradient(800px 500px at -10% 10%,#67e8f988,transparent)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
input,textarea,select{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
#top{position:sticky;top:0;z-index:20;background:var(--top);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:17px}
.sp{flex:1}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px}
#stage{max-width:820px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:17px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:linear-gradient(135deg,var(--acc),#6366f1);color:var(--onacc);font-weight:700;border-radius:12px;padding:11px 16px}
.btn.alt{background:var(--card);border:1px solid var(--line);color:var(--tx);font-weight:600}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px}
.chip.on{background:var(--acc);color:var(--onacc);font-weight:700;border-color:var(--acc)}
.msg{display:flex;gap:10px;margin:12px 0;animation:in .35s both}
.av{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));font-size:18px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:12px 14px;flex:1;line-height:1.55}
.msg.me{justify-content:flex-end}.msg.me .bub{flex:none;max-width:85%;background:#0e749066;border-radius:18px 6px 18px 18px}
[dir=rtl] .bub{border-radius:18px 6px 18px 18px}[dir=rtl] .msg.me .bub{border-radius:6px 18px 18px 18px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tpls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.tpl{background:linear-gradient(160deg,var(--soft2),var(--soft));border:1px solid var(--line);border-radius:16px;padding:14px;text-align:start;transition:.2s}
.tpl:hover,.tpl:active{transform:translateY(-3px);border-color:var(--acc)}
.tpl .ic{font-size:30px}.tpl b{display:block;margin:6px 0 2px}
.run{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.step{display:flex;gap:8px;align-items:center;padding:5px 0;color:var(--mut)}
.step.done{color:var(--tx)}.step .d{width:18px;text-align:center}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
label.l{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.pl.act{border-color:var(--acc);box-shadow:0 0 0 2px #22d3ee33,0 0 24px #22d3ee22}
.pl .n{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:6px}
.pl .p{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:9px;background:var(--soft2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.gates{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gate{background:linear-gradient(160deg,var(--soft2),var(--soft));border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.gate .ic{font-size:26px}.gate small{display:block;color:var(--mut);font-size:11px}
.gate:active{transform:scale(.96)}
.gate.ai{border-color:var(--acc2);background:linear-gradient(160deg,#a78bfa22,#22d3ee11)}
.qc{font-size:20px;line-height:1.6;margin:8px 0 12px;font-weight:600}
.opt{display:block;width:100%;text-align:start;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0;font-size:16px;transition:.15s}
.opt:active{transform:scale(.98);border-color:var(--acc)}
.opt.gone{opacity:.15;pointer-events:none;text-decoration:line-through}
.tb{height:8px;background:var(--soft2);border-radius:9px;overflow:hidden}.tb i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--gold),var(--bad));background-size:300% 100%;transition:width .1s linear}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--soft2);color:var(--mut)}
.tag.g{background:#fbbf2426;color:var(--gold)}.tag.p{background:#a78bfa33;color:#d8c8ff}
.crd{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.crd b{background:var(--acc);color:var(--onacc);border-radius:99px;padding:0 7px;font-size:12px}
.crd.k-help{border-color:#34d39966}.crd.k-chal{border-color:#fb718566}.crd.k-magic{border-color:#fbbf2466}.crd.k-trap{border-color:#a78bfa88}
.crd:disabled,.crd.off{opacity:.35}
.big{font-size:54px;text-align:center}
.ok{color:var(--good)}.no{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start}
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}.modal>div{background:var(--sheet);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:720px;max-height:86vh;overflow:auto;padding:16px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--sheet);border:1px solid var(--acc);border-radius:14px;padding:10px 16px;z-index:60;display:none;max-width:90%;text-align:center}
.wheelw{position:relative;width:260px;height:260px;margin:14px auto}
.wheel{width:100%;height:100%;border-radius:50%;border:4px solid var(--gold);transition:transform 3.2s cubic-bezier(.12,.7,.1,1);position:relative}
.wheel span{position:absolute;left:50%;top:50%;font-size:12px;font-weight:700;width:90px;margin-left:-45px;margin-top:-9px;text-align:center;color:var(--onacc)}
.ptr{position:absolute;top:-14px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:22px solid #fff}
.box{font-size:90px;text-align:center;cursor:pointer;animation:bob 1.2s infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.cf{position:fixed;top:-20px;font-size:22px;z-index:70;animation:fall 3s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.codebox{font-size:44px;font-weight:900;letter-spacing:10px;text-align:center;background:var(--in);border:1px dashed var(--acc);border-radius:16px;padding:14px;margin:12px 0;font-family:ui-monospace,monospace;color:var(--acc)}
.lbl{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.badge{display:inline-flex;gap:6px;align-items:center;background:linear-gradient(135deg,#fbbf2433,#f59e0b22);border:1px solid #fbbf2477;color:var(--gold);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}

.btn,.chip,.gate,.tpl,.opt,.crd,.pill,#nav button{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s,border-color .25s,opacity .25s}
.btn:active,.chip:active,.crd:active,.pill:active{transform:scale(.95)}
.btn:hover,.gate:hover,.crd:not(.off):hover{transform:translateY(-2px)}
.gate:hover{border-color:var(--acc);box-shadow:0 8px 24px #22d3ee22}
.opt:hover{border-color:var(--acc);transform:translateX(3px)}[dir=rtl] .opt:hover{transform:translateX(-3px)}
@keyframes viewIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes optIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
@keyframes sheet{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes glow{50%{box-shadow:0 0 0 2px #22d3ee55,0 0 34px #22d3ee44}}
#stage.enter>*{animation:viewIn .45s cubic-bezier(.2,.8,.2,1) both}
#stage.enter>*:nth-child(2){animation-delay:.06s}#stage.enter>*:nth-child(3){animation-delay:.12s}#stage.enter>*:nth-child(4){animation-delay:.18s}#stage.enter>*:nth-child(5){animation-delay:.24s}
#stage.enter .gates>.gate{animation:optIn .4s both}
#stage.enter .gates>.gate:nth-child(2){animation-delay:.05s}#stage.enter .gates>.gate:nth-child(3){animation-delay:.1s}#stage.enter .gates>.gate:nth-child(4){animation-delay:.15s}#stage.enter .gates>.gate:nth-child(5){animation-delay:.2s}#stage.enter .gates>.gate:nth-child(n+6){animation-delay:.25s}
.opt{animation:optIn .4s both}
.big{animation:pop .55s cubic-bezier(.3,1.5,.5,1) both}
.pl.act{animation:glow 2.4s ease-in-out infinite}
.pl .p{transition:color .3s}
.bar i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
.modal.on{animation:fadeIn .2s both}.modal.on>div{animation:sheet .35s cubic-bezier(.2,.8,.2,1) both}
#toast{animation:toastIn .3s both}
.msg .bub{transition:box-shadow .3s}
.qimg{display:block;max-width:100%;max-height:280px;margin:8px auto;border-radius:14px;border:1px solid var(--line);object-fit:contain;background:var(--in)}
.qc{white-space:pre-line}
.drop{border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;background:var(--soft)}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.switch{display:flex;gap:8px}
.pill{white-space:nowrap;padding:6px 10px}#top{gap:6px}.brand{white-space:nowrap}@media(max-width:470px){.brand span{display:none}}
:root[data-theme=light] .tag.p{background:#7c3aed22;color:#5b21b6}:root[data-theme=light] .tag.g{background:#b4530922;color:#92400e}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.dnode{opacity:0;transform:translateY(12px) scale(.97);transition:opacity .45s,transform .45s}.dnode.on{opacity:1;transform:none}.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dline{width:2px;height:16px;margin:0 auto;background:linear-gradient(var(--acc),var(--gold))}.opt.right{border-color:var(--good)!important;background:rgba(34,197,94,.18)}.opt.wrong{border-color:var(--bad)!important;background:rgba(239,68,68,.18)}@media(max-width:380px){.dgrid{grid-template-columns:1fr}}

/* ===== v7 ===== */
#side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:262px;z-index:40;background:var(--sheet);border-inline-end:1px solid var(--line);transform:translateX(-104%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:14px 10px;overflow:auto}
[dir=rtl] #side{transform:translateX(104%)}
body.sideopen #side{transform:none}
#scrim{position:fixed;inset:0;background:#000a;z-index:35;display:none;animation:fadeIn .2s both}
body.sideopen #scrim{display:block}
.shead{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;font-weight:800}
.sgrp{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:14px 8px 6px}
#nav{display:flex;flex-direction:column;gap:3px}
.sitem{display:flex;gap:10px;align-items:center;width:100%;text-align:start;background:transparent;border:1px solid transparent;border-radius:14px;padding:11px 12px;color:var(--mut);font-size:14px;position:relative;overflow:hidden;transition:transform .2s,background .2s,color .2s,border-color .2s}
.sitem:hover{background:var(--soft2);color:var(--tx);transform:translateX(5px);border-color:var(--line)}
[dir=rtl] .sitem:hover{transform:translateX(-5px)}
.sitem .si{font-size:18px;width:24px;text-align:center}
.sitem.on{background:linear-gradient(135deg,#0e7490,#6d28d9);color:#fff;border-color:transparent}
.sitem .lk{margin-inline-start:auto;font-size:12px}
#sfoot{margin-top:auto;padding-top:14px}
.planpill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
@media(min-width:900px){#side{transform:none!important}body.hasside{padding-inline-start:262px}#scrim{display:none!important}#menubtn{display:none!important}.shead .pill{display:none}}
/* composer */
#composer{position:fixed;inset-inline:0;bottom:0;z-index:25;padding:24px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 38%);display:none}
@media(min-width:900px){body.hasside #composer{inset-inline-start:262px}}
.cwrap{max-width:820px;margin:0 auto}
.cbox{display:flex;gap:6px;align-items:flex-end;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:7px;box-shadow:0 8px 30px #0005}
.cbox:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px #22d3ee22,0 8px 30px #0005}
#cin{border:0;background:transparent;resize:none;max-height:40vh;padding:9px 6px;line-height:1.5;border-radius:12px;min-height:40px}
#cin:focus{border:0}
.cbtn{width:42px;height:42px;border-radius:50%;flex:none;background:var(--soft2);font-size:19px;display:grid;place-items:center;transition:transform .2s,background .2s}
.cbtn:hover{transform:scale(1.1) rotate(-8deg);background:var(--soft)}
.cbtn.send{background:linear-gradient(135deg,var(--acc),#6366f1);color:var(--onacc);font-weight:800}
.cbtn.send:hover{transform:scale(1.1) translateX(2px)}
[dir=rtl] .cbtn.send{transform:scaleX(-1)}[dir=rtl] .cbtn.send:hover{transform:scaleX(-1) scale(1.1)}
#attrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.achip{background:var(--card);border:1px solid var(--acc);border-radius:99px;padding:5px 10px;font-size:12px;animation:pop .3s both}
.achip a{cursor:pointer;color:var(--bad);margin-inline-start:4px}
body.hascomp #stage{padding-bottom:170px}
#cfile{display:none}
/* plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:10px 0}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.pcard:hover{transform:translateY(-6px);box-shadow:0 16px 40px #0006;border-color:var(--acc2)}
.pcard.cur{border-color:var(--acc);box-shadow:0 0 0 2px #22d3ee33,0 0 30px #22d3ee22}
.pcard .pic{font-size:36px}.pcard h3{margin:4px 0}
.flist{list-style:none;padding:0;margin:8px 0}.flist li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.ctab td:first-child{min-width:190px}.ctab tr:hover td{background:var(--soft)}
/* hover polish */
.btn{position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover::after{left:130%}
.card{transition:border-color .25s,box-shadow .25s}
.card:hover{border-color:#22d3ee44}
.tpl:hover .ic{animation:wob .6s}
@keyframes wob{25%{transform:rotate(-12deg) scale(1.18)}75%{transform:rotate(10deg) scale(1.18)}}
.chip:hover,.pill:hover{border-color:var(--acc);transform:translateY(-1px)}
.gate:hover .ic{animation:wob .6s}
tr:hover td{background:var(--soft)}
.msg:hover .bub{box-shadow:0 4px 18px #0004}
/* diamond animation to the judge */
.dline{height:28px;overflow:hidden;transform:scaleY(0);transform-origin:top;transition:transform .4s;position:relative}
.dline.on{transform:none}
.dline.on::after{content:'';position:absolute;left:-1px;width:4px;height:10px;border-radius:4px;background:#fff;filter:blur(1.5px);animation:flow .9s linear infinite}
@keyframes flow{from{top:-10px}to{top:100%}}
.dnode.on{animation:nodeglow 1.3s ease-out}
@keyframes nodeglow{0%{box-shadow:0 0 0 0 #22d3ee00}35%{box-shadow:0 0 30px 5px #22d3ee66}100%{box-shadow:0 0 0 0 #22d3ee00}}
.dgem{display:inline-block;color:var(--acc);animation:gem 2.6s ease-in-out infinite}
@keyframes gem{0%,100%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(1.2)}}
.dnode[data-i=judge].on{border-color:var(--gold)!important}
@media (prefers-reduced-motion:reduce){.dline.on::after,.dgem{animation:none}}
.gback{max-width:820px;margin:0 auto 8px;display:flex}
.gback .btn{border-radius:99px}
</style>
</head>
<body>
<div id="top">
  <button class="pill" id="menubtn" style="display:none" onclick="toggleSide()" aria-label="menu">☰</button>
  <div class="brand"><div class="logo">🎮</div><span>Gamify Agent</span></div>
  <div class="sp"></div>
  <button class="pill" id="homebtn" style="display:none" onclick="goHome()">🏠</button><button class="pill" id="aibtn" onclick="aiSettings()">🔌 AI ○</button><button class="pill" id="thbtn" onclick="toggleTheme()">🌙</button><button class="pill" id="langbtn" onclick="toggleUI()">العربية</button>
</div>
<aside id="side"><div class="shead"><div class="logo">🎮</div><span style="flex:1">Gamify Agent</span><button class="pill" onclick="toggleSide(false)">✕</button></div><div id="nav"></div><div id="sfoot"></div></aside><div id="scrim" onclick="toggleSide(false)"></div>
<div id="stage"></div>

/* ============ cloze generator (materials -> questions) ============ */
function genFromText(text,lang){
 const sents=text.split(/[\.\!\?؟؛\n]+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=5);
 const stop=new Set('which their there these those about because between during through while where would could should other after before being using called known'.split(' '));
 const items=[];sents.forEach(s=>{const ws=s.split(/\s+/).map(w=>w.replace(/[^\p{L}\p{N}]/gu,'')).filter(w=>w.length>=4&&!stop.has(w.toLowerCase()));if(!ws.length)return;const k=ws.sort((a,b)=>b.length-a.length)[0];items.push({s,k})});
 const keys=[...new Set(items.map(i=>i.k))];const out=[];
 items.slice(0,12).forEach(it=>{let pool=keys.filter(k=>k!==it.k);while(pool.length<3)pool.push(rnd(['—','…','؟'])+pool.length);const d=shuffle(pool).slice(0,3);const opts=shuffle([it.k,...d]);const q=it.s.replace(it.k,'_____');const tier=it.k.length>=9?3:it.k.length>=7?2:1;
  out.push({cat:'mats',tier,type:'mc',q:{en:q,ar:q},o:{en:opts,ar:opts},a:opts.indexOf(it.k)})});return out}

 if(tid==='edu'){

   if(!mine.length&&llmReady()){toast('🤖 '+tr('Writing questions…','أكتب الأسئلة…'),4000);try{const it=await llmJSON(genPrompt({subject:subjName(sj),lang:gl,n:10,styles:'mcq,tf,fill'}),3000);mine=it.map(i=>mkQ(i,'x')).filter(Boolean)}catch(e){toast('⚠️ '+e.message,4000)}}

   pool=mine.map(q=>Object.assign({},q,{cat:styleOf(q)}));aiTopic=subjName(sj)}
  else{pool=base.concat(ups.map(q=>Object.assign({},q,{cat:BUILTIN[q.subj]||'oth'})));aiTopic='school subjects: '+SUBJECTS.filter(s=>pool.some(q=>q.cat===s.cat)).map(s=>s.en).join(', ')}
  const f=pool.filter(q=>q.cat==='ai'||sty.has(styleOf(q)));if(f.length)pool=f;
  if(single)gates=[...new Set(pool.map(q=>q.cat))].filter(c=>STYLEN[c]).map(c=>({kind:'mc',id:c,icon:STYLEN[c].icon,n:STYLEN[c]}));
  else gates=SUBJECTS.filter(s=>pool.some(q=>q.cat===s.cat)).map(s=>({kind:'mc',id:s.cat,icon:s.icon,n:{en:s.en,ar:s.ar}}));
 }else{pool=base;gates=t.gates.filter(g=>!g.advOnly||lv==='adv').map(g=>({kind:'mc',...g}));aiTopic=tid==='sports'?'football (soccer) general knowledge':(t.custom?`${L(t.name)} (${t.gates.map(g=>L(g.n)).join(', ')})`:'')}
 if(o.qc>0){const by={};pool.forEach(q=>(by[q.cat]=by[q.cat]||[]).push(q));pool=Object.values(by).flatMap(a=>shuffle(a).slice(0,o.qc))}
 gates=gates.filter(g=>g.kind!=='mc'||pool.some(q=>q.cat===g.id));
 const aiDef=t.ai||{icon:'🤖',n:{en:'AI Host',ar:'المحاوِر الذكي'}};const live=llmReady()&&tid!=='quran';
 if((t.ai&&pool.some(q=>q.cat==='ai'))||live)gates.push({kind:'ai',id:'ai',icon:aiDef.icon,n:aiDef.n,grp:live?tr('Live AI questions','أسئلة ذكية حيّة'):tr('Prepared AI questions','أسئلة ذكية مُعدّة')});

 const inv=()=>Object.fromEntries(Object.keys(CARDS).map(k=>[k,FREE.includes(k)&&!(o.mtm==='paid'&&['magic','trap'].includes(CARDS[k].k))?1:0]));
 const mk=n=>({name:n,pts:5000,cards:inv(),streak:0,correct:0,wrong:0,double:false,shield:false,trap:null,ban:false,banNow:false});

function armCard(k0){const k=CARDS[k0].fx||k0;const p=P(),o=O(),c=CARDS[k0];if(!p.cards[k0])return;
 if(k==='mx2'){if(p.double)return toast(tr('Already armed','مفعّلة بالفعل'));p.double=true}

function pickGate(id){
 const g=G.gates.find(x=>x.id===id);
 if(g.kind==='mc'||g.kind==='abil'){if(!G.selVal)return toast(tr('Pick a value first','اختر القيمة أولًا'))}
 if(g.kind==='speed')return startSpeed();
 if(g.kind==='abil')return viewAbilPick(g);
 if(g.kind==='ai')return aiGate(g);
 const val=G.selVal,tier=tierFor(val);const pl=G.pool.filter(x=>x.cat===id);let un=pl.filter(x=>!G.used.has(x)&&!seenHas(x));if(!un.length){pl.forEach(x=>{G.used.delete(x);seenDel(x)});un=pl.slice()}
 if(!un.length)return toast(tr('No questions in this category','لا توجد أسئلة في هذه الفئة'));

function mkQ(it,gate,img){if(!it||!it.q)return null;const q=String(it.q).trim();const tier=Math.min(3,Math.max(1,+it.tier||1));const ar=/[؀-ۿ]/.test(q);const base={cat:gate,tier,q:{en:q,ar:q}};if(it.explain)base.expl=String(it.explain);if(img&&it.useImage)base.img=img;
 if(it.type==='tf'||typeof it.correct==='boolean'){const t=ar?['صح','خطأ']:['True','False'];const truth=it.correct===true||/^(true|صح|صحيح)$/i.test(String(it.correct));return Object.assign(base,{type:'mc',o:{en:t,ar:t},a:truth?0:1})}
 if(it.type==='typed'||!Array.isArray(it.options)||it.options.length<2){const acc=(it.answers&&it.answers.length?it.answers:[it.correct]).filter(x=>x!=null&&x!=='').map(String);if(!acc.length)return null;return Object.assign(base,{type:'ty',acc:{en:acc,ar:acc}})}

function parseQuestions(text){
 const lines=text.replace(/\r/g,'').split('\n').map(s=>s.replace(/[*_`#]/g,'').trim());const blocks=[];let cur=null,m,mode='';
 const D='0-9٠-٩';
 const qs=new RegExp('^(?:[Qq]\\s*['+D+']*|['+D+']+|س\\s*['+D+']*)\\s*[\\.\\):\\-－]\\s*(.+)'),qlab=/^(?:السؤال|سؤال|question)\s*[:：]\s*(.+)/i,
  op=/^\(?([A-Da-dأبجد])\s*[\.\)\-:]\s*(.+)/,
  an=/^(?:answer|correct answer|ans|الإجابة الصحيحة|الاجابة الصحيحة|الإجابة|الاجابة|الجواب الصحيح|الجواب)\s*[:：]\s*(.+)/i,
  ex=/^(?:لو أخطأت|إذا أخطأت|اذا اخطأت|لو غلطت|الشرح|التصحيح|شرح[^:：]{0,25}|تصحيح[^:：]{0,25}|explanation|if wrong|hint)[^:：]{0,25}[:：]\s*(.+)/i;
 const strip=q=>q.replace(/^(?:السؤال|سؤال|question)\s*[:：]\s*/i,'').trim();
 for(const l of lines){if(!l)continue;
  if(m=l.match(ex)){if(cur){cur.expl=m[1].trim();mode='e'}continue}
  if(m=l.match(an)){if(cur){cur.ans=m[1].trim();mode='a'}continue}
  if(cur&&(m=l.match(op))){cur.opts.push(m[2].trim());cur.keys.push(m[1].toLowerCase());mode='o';continue}
  if(m=l.match(qs)||l.match(qlab)){cur={q:strip(m[1]),opts:[],keys:[],ans:null,expl:''};blocks.push(cur);mode='q';continue}
  if(cur){if(mode==='e')cur.expl+=' '+l;else if(mode==='q'&&!cur.opts.length&&cur.ans==null)cur.q+=' '+l}}
 const out=[];blocks.forEach(b=>{if(b.ans==null)return;const a=b.ans;let it;
  if(b.opts.length>=2){const k=a.charAt(0).toLowerCase();let i=b.keys.indexOf(k);if(i<0||a.length>2&&!/^[A-Da-dأبجد][\.\)]?$/.test(a.trim()))i=b.opts.findIndex(o=>norm(o)===norm(a.replace(/^[A-Da-dأبجد][\.\)]\s*/,'')));if(i<0)return;it={type:'mc',q:b.q,options:b.opts,correct:i}}
  else if(/^(true|false|صح|خطأ|صحيح|خاطئ)$/i.test(a))it={type:'tf',q:b.q,correct:/^(true|صح|صحيح)$/i.test(a)};
  else{const ans=a.split(/[\/|،]/).map(x=>x.trim()).filter(Boolean);const nm=a.match(/^[0-9٠-٩][0-9٠-٩.,٫]*/);if(nm&&!ans.includes(nm[0]))ans.push(nm[0]);it={type:'typed',q:b.q,answers:ans}}

function imgData(f,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('bad image'));im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)})}

function dmRun(ctx){
 const t0=performance.now();const pool=ctx.pool,seen=new Set(),clean=[];let inval=0,dups=0;
 pool.forEach(q=>{let ok=true;const t=(q.q&&(q.q.en||q.q.ar))||'';
  if(q.type==='mc'){const o=q.o&&(q.o.en||q.o.ar);ok=Array.isArray(o)&&o.length>=2&&q.a>=0&&q.a<o.length&&new Set(o.map(qbKey)).size===o.length}
  else if(q.type==='ty'){const a=q.acc&&(q.acc.en||q.acc.ar);ok=Array.isArray(a)&&a.length>0}else ok=false;
  if(t.length<3)ok=false;if(!ok){inval++;return}

 const L1={id:'content',icon:'🎯',title:{en:'Content accuracy',ar:'دقة المحتوى'},st:(inval||dups)?'warn':'ok',lines:[`${tr('kept','المقبول')}: ${clean.length}/${pool.length}`,`${tr('invalid removed','أسئلة معطوبة حُذفت')}: ${inval}`,`${tr('duplicates removed','مكررات حُذفت')}: ${dups}`,ctx.tid==='quran'||pool.some(q=>q.cat==='quran')?tr('Quran: only human-reviewed texts play','القرآن: لا تُلعب إلا النصوص المراجعة بشريًّا'):tr('Facts need review before public release','الحقائق تحتاج مراجعة قبل الإصدار العام')]};
 const hist={1:0,2:0,3:0};clean.forEach(q=>hist[q.tier||1]++);const miss=[1,2,3].filter(x=>!hist[x]);
 const L2={id:'ladder',icon:'📈',title:{en:'Difficulty ladder',ar:'سُلّم الصعوبة'},st:(miss.length&&ctx.o.dm!=='fixed'&&clean.length>=6)?'warn':'ok',lines:[`★ ${hist[1]} · ★★ ${hist[2]} · ★★★ ${hist[3]}`,`${tr('model','النموذج')}: ${ctx.o.dm}`,miss.length&&clean.length>=6?tr('Missing tier(s): '+miss.join(','),'مستويات ناقصة: '+miss.join('،'))+' → '+tr('nearest tier is used','يُستخدم أقرب مستوى'):tr('All tiers covered or not needed','المستويات مغطّاة أو غير مطلوبة')]};

 const ai=llmReady()&&ctx.tid!=='quran';
 const L4={id:'fun',icon:'🎁',title:{en:'Engagement & rewards',ar:'التشويق والمكافآت'},st:'ok',lines:[`${tr('prizes','الجوائز')}: ${ctx.o.pz} · ${tr('cards','البطاقات')}: ${ctx.o.mtm}`,`${tr('Genius Area at','منطقة العباقرة عند')} ${ctx.gth}`,ai?tr('AI host: live questions ON','المحاوِر الذكي: أسئلة حيّة مفعّلة'):tr('AI host: waiting for an API key','المحاوِر الذكي: ينتظر مفتاح API'),tr('Streak rewards: wheel / boxes','مكافآت السلاسل: عجلة / صناديق')]};
 const lanes=[L1,L2,L3,L4],errs=clean.length?0:1,warns=lanes.filter(l=>l.st==='warn').length;

 T('Quran gate: unreviewed blocked, reviewed allowed',()=>{QB.unrev=false;const q=mk('qq',{category:'quran'});return (!qbUsable(q)&&qbUsable(Object.assign({},q,{reviewed:true})))||'gate wrong'});
 T('Import aliases: sports→football, beginner→primary',()=>{const r=qbNorm({category:'sports',level:'beginner',question:'سؤال اختبار طويل',options:['a','b'],answer:'b'});return (r.category==='football'&&r.level==='primary'&&r.correctIndex===1)||JSON.stringify(r)});
 T('Bank → game question keeps the right answer',()=>{const x=mk('z',{options:['أ','ب','ج','د'],correctIndex:2});const q=qbToQ(x);return q.o.ar[q.a]==='ج'||'mismatch'});

 T('Parser: Arabic question with answer line',()=>{const r=parseQuestions('1. ما عاصمة مصر؟\nأ) القاهرة\nب) الجيزة\nج) الأقصر\nالإجابة: أ');return (r.length===1&&JSON.stringify(r[0]).includes('القاهرة'))||JSON.stringify(r).slice(0,120)});

function qh(q){const s=(q.cat||'')+'|'+((q.q&&(q.q.en||q.q.ar))||'');let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
const seenGet=()=>store('ga_seen_'+G.tid)||[];
const seenHas=q=>seenGet().includes(qh(q));
function seenAdd(q){const a=seenGet(),k=qh(q);if(!a.includes(k)){a.push(k);store('ga_seen_'+G.tid,a.slice(-1500))}}
function seenDel(q){const k=qh(q);store('ga_seen_'+G.tid,seenGet().filter(x=>x!==k))}
function resetSeen(){try{Object.keys(localStorage).filter(k=>k.startsWith('ga_seen_')).forEach(k=>localStorage.removeItem(k))}catch(e){}toast('♻️ '+tr('Question history cleared','تم مسح سجل الأسئلة'))}

async function chatSend(){
 const ta=$('#cin');if(!ta||!FEED||!$('#feed'))return;const text=ta.value.trim();if(!text&&!ATT.length)return;
 if(ATT.length>1&&!can('multifile'))return showUpgrade('multifile');
 const files=ATT.slice();ATT=[];chatAtt();ta.value='';chatGrow(ta);
 userMsg((text.length>400?text.slice(0,400)+'…':text)+(files.length?'\n📎 '+files.map(f=>f.name).join(', '):''));
 if(!files.length&&text.length<=160){
  if(RX.builder.test(text))return builderView();
  if(RX.quran.test(text))return pickTpl('quran');
  if(RX.sports.test(text))return pickTpl('sports');
  if(RX.edu.test(text))return pickTpl('edu');
  if(RX.plans.test(text))return agentMsg(`${tr('Starter is free; Creator and Institution unlock more. See every feature side by side:','المبتدئ مجاني، والمبدع والمؤسسات تفتحان المزيد. شاهد كل الميزات جنبًا إلى جنب:')}<div class="row" style="margin-top:8px"><button class="btn sm" onclick="go('plans')">💎 ${tr('Plans','الخطط')}</button></div>`);
  if(RX.help.test(text))return agentMsg(`${tr('I can: build games from a lesson or files, run Education / Quran / Sports contests, create your own template, and explain the plans. Paste a long text or attach files with 📎.','أستطيع: بناء ألعاب من درس أو ملفات، وتشغيل مسابقات التعليم والقرآن والرياضة، وإنشاء قالبك الخاص، وشرح الخطط. ألصق نصًّا طويلًا أو أرفق ملفات بزر 📎.')}`);
  if(llmReady()&&can('ai'))return chatLLM(text);
  return agentMsg(`${tr('I did not catch a game idea. Pick a template, or paste your lesson / attach files and I will turn them into questions.','لم أفهم فكرة لعبة. اختر قالبًا، أو ألصق درسك / أرفق ملفاتك وسأحوّلها إلى أسئلة.')}<div class="row" style="margin-top:8px"><button class="btn sm" onclick="pickTpl('edu')">🎓 ${tr('Education','التعليم')}</button><button class="btn alt sm" onclick="pickTpl('quran')">🕌 ${tr('Quran','القرآن')}</button><button class="btn alt sm" onclick="pickTpl('sports')">🏰 ${tr('Sports','الرياضة')}</button></div>`);
 }
 return chatMaterials(files,text);
}
